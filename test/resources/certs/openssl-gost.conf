# OpenSSL 3.x configuration enabling GOST (legacy provider + reference GOST
# engine). Used by the cross-check test that parses a gostcert-issued
# certificate with OpenSSL. The system LibreSSL does not support GOST, so the
# test looks for a GOST-capable OpenSSL 3 binary and skips otherwise.
openssl_conf = openssl_init

[openssl_init]
providers = provider_sect
engines = engine_sect

[provider_sect]
default = default_sect
legacy = legacy_sect

[default_sect]
activate = 1

[legacy_sect]
activate = 1

[engine_sect]
gost = gost_sect

[gost_sect]
default_algorithms = ALL
CRYPT_PARAMS = id-Gost28147-89-CryptoPro-A-ParamSet
